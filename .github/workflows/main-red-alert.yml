name: Main Red Alert

# Fires when the CI workflow finishes running on main. If it failed, opens (or
# updates) one rolling GitHub issue so a bad merge to main can't go unnoticed —
# GitHub Free has no branch-protection gate to prevent the merge itself, so
# this is the detection layer that replaces it (Task 1A.1; see
# MASTER_ENGINEERING_ROADMAP.md "Founder Decision — GitHub Free, Permanently").
# Auto-closes the issue with a comment once CI is green on main again.
#
# workflow_run always executes using the workflow file from the repo's default
# branch, regardless of which branch's push triggered the upstream CI run —
# this is a GitHub Actions security property, not a choice made here.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  issues: write

jobs:
  alert:
    name: Report main status
    runs-on: ubuntu-latest
    if: github.event.workflow_run.head_branch == 'main'

    steps:
      - name: Open, update, or close the rolling issue
        uses: actions/github-script@v7
        with:
          script: |
            const conclusion = context.payload.workflow_run.conclusion;
            const runUrl = context.payload.workflow_run.html_url;
            const sha = context.payload.workflow_run.head_sha;
            const marker = '<!-- main-red-alert -->';

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
            });
            const existing = issues.find((i) => i.body && i.body.includes(marker));

            if (conclusion === 'success') {
              if (existing) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  body: `CI is green on main again: ${runUrl} (commit ${sha})`,
                });
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  state: 'closed',
                });
              }
              return;
            }

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Still red: ${runUrl} (commit ${sha}, conclusion: ${conclusion})`,
              });
              return;
            }

            const body = [
              marker,
              `CI failed on \`main\` (conclusion: **${conclusion}**).`,
              '',
              `Run: ${runUrl}`,
              `Commit: ${sha}`,
              '',
              'GitHub Free has no branch-protection gate to prevent this from having merged — treat this as a live signal to check the run and roll back if needed (see docs/RELEASE_STRATEGY.md rollback vocabulary).',
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'main is red',
              body,
            });

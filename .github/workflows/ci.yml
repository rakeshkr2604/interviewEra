name: CI

# Validates on every push to any branch (direct-branch iteration, Dependabot
# pushes) AND on pull requests targeting main (so required-status-check
# branch protection has something to bind to once enabled — see
# docs/BRANCH_PROTECTION_SETUP.md). A branch with an open PR will trigger
# both events on the same commit; this is accepted duplication for now
# (see docs/ENGINEERING_PLATFORM.md Phase 9) — path filtering to reduce it
# is a later phase, not part of this change.
on:
  push:
    branches:
      - '**'
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
  workflow_dispatch:

# Cancel any in-progress run on the same branch when a new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Job 1: Lint + Type Check ─────────────────────────────────────────────────
  quality:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

  # ── Job 1b: E2E auth (Playwright) ───────────────────────────────────────────
  e2e_auth:
    name: E2E Auth
    runs-on: ubuntu-latest
    needs: [quality]
    env:
      # JWT-shaped placeholders pass createServiceClient() format checks at runtime;
      # real auth stays skipped (global-setup fails against fake host).
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
      OPENAI_API_KEY: sk-placeholder
      RESEND_API_KEY: re_placeholder
      UPSTASH_REDIS_REST_URL: https://placeholder.upstash.io
      UPSTASH_REDIS_REST_TOKEN: placeholder_token
      RAZORPAY_KEY_ID: rzp_test_placeholder
      RAZORPAY_KEY_SECRET: placeholder_secret
      RAZORPAY_WEBHOOK_SECRET: placeholder_webhook
      NEXT_PUBLIC_RAZORPAY_KEY_ID: rzp_test_placeholder

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Build
        run: npm run build

      - name: E2E tests
        run: npm run test:e2e
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000

  # ── Pdf extract regression (pdfjs-dist + fallback) ───────────────────────────
  pdf_extract:
    name: PDF extract regression
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Extract fixtures
        run: npm run verify:pdf

  # ── Job 2: Production Build ───────────────────────────────────────────────────
  # Runs after quality passes. Uses placeholder values for all env vars so the
  # build can complete without real credentials.
  # Real values live in Vercel — Vercel handles the actual deployment.
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [quality, pdf_extract, e2e_auth]

    env:
      # Public vars
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder_anon_key
      NEXT_PUBLIC_RAZORPAY_KEY_ID: rzp_test_placeholder
      NEXT_PUBLIC_APP_URL: https://interviewera.com
      NEXT_PUBLIC_CALENDLY_URL: https://calendly.com/placeholder
      # Server vars — SDKs that validate keys at import time need these to be non-empty
      SUPABASE_SERVICE_ROLE_KEY: placeholder_service_role
      OPENAI_API_KEY: sk-placeholder
      MISTRAL_API_KEY: placeholder_mistral
      OPENROUTER_API_KEY: placeholder_openrouter
      RESEND_API_KEY: re_placeholder
      RAZORPAY_KEY_ID: rzp_placeholder
      RAZORPAY_KEY_SECRET: placeholder_secret
      RAZORPAY_WEBHOOK_SECRET: placeholder_webhook
      UPSTASH_REDIS_REST_URL: https://placeholder.upstash.io
      UPSTASH_REDIS_REST_TOKEN: placeholder_token
      CRON_SECRET: placeholder_cron
      UNSUBSCRIBE_SECRET: placeholder_unsub

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Cache Next.js build
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*.ts', 'src/**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-
            ${{ runner.os }}-nextjs-

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  # ── Job 3: Security Audit ────────────────────────────────────────────────────
  # Fails on critical vulnerabilities. High-severity issues in transitive
  # build-tool deps (serialize-javascript via next-pwa's Webpack chain) cannot
  # be fixed without a breaking next-pwa downgrade — tracked via Dependabot.
  audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit
        run: npm audit --audit-level=critical

  # ── Job 4: Secret Scan ────────────────────────────────────────────────────────
  # Gitleaks — scans every push and PR for accidentally committed secrets.
  # Independent of the other jobs (like `audit`) so it doesn't slow down the
  # build; still contributes its own pass/fail status to the overall run.
  # Free for this repo (personal-account private repo — GITLEAKS_LICENSE is
  # only required for GitHub Organization-owned repos, not User-owned ones).
  # Config: .gitleaks.toml allowlists the two known-fake JWT-shaped placeholder
  # values already in this file's e2e_auth job (not real secrets).
  secrets_scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Job 5: Merge Readiness Summary ───────────────────────────────────────────
  # GitHub Free has no required-status-checks UI to show "all checks must pass"
  # in one place — this job builds that visibility by hand (Task 1A.1; see
  # MASTER_ENGINEERING_ROADMAP.md "Founder Decision — GitHub Free, Permanently").
  # Posts (or updates, on re-push) one PR comment summarizing every job's result.
  # `if: always()` so it still runs and reports even when an upstream job failed.
  merge_readiness:
    name: Merge Readiness Summary
    runs-on: ubuntu-latest
    if: always() && github.event_name == 'pull_request'
    needs: [quality, e2e_auth, pdf_extract, build, audit, secrets_scan]
    permissions:
      pull-requests: write

    steps:
      - name: Post merge-readiness comment
        uses: actions/github-script@v7
        with:
          script: |
            const results = {
              'Lint & Type Check': '${{ needs.quality.result }}',
              'E2E Auth': '${{ needs.e2e_auth.result }}',
              'PDF extract regression': '${{ needs.pdf_extract.result }}',
              'Build': '${{ needs.build.result }}',
              'Security Audit': '${{ needs.audit.result }}',
              'Secret Scan': '${{ needs.secrets_scan.result }}',
            };
            const icon = (r) => (r === 'success' ? '✅' : r === 'skipped' ? '⏭️' : '❌');
            const allGood = Object.values(results).every((r) => r === 'success' || r === 'skipped');
            const lines = Object.entries(results).map(([name, r]) => `${icon(r)} **${name}** — ${r}`);
            const marker = '<!-- ci-merge-readiness -->';
            const body = [
              marker,
              allGood
                ? '### ✅ Merge Readiness: all checks passed'
                : '### ❌ Merge Readiness: one or more checks failed',
              '',
              ...lines,
              '',
              '_GitHub Free has no required-status-checks gate — this comment is the visibility layer. Do not merge if anything above is red._',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

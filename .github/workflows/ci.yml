name: CI

# Solo workflow: validate on every push to any branch — no PR required.
# Dependabot still gets CI when it pushes to dependabot/* branches.
on:
  push:
    branches:
      - '**'
  workflow_dispatch:

# Cancel any in-progress run on the same branch when a new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Job 1: Lint + Type Check ─────────────────────────────────────────────────
  quality:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

  # ── Pdf extract regression (pdfjs-dist + fallback) ───────────────────────────
  pdf_extract:
    name: PDF extract regression
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Extract fixtures
        run: npm run verify:pdf

  # ── Job 2: Production Build ───────────────────────────────────────────────────
  # Runs after quality passes. Uses placeholder values for all env vars so the
  # build can complete without real credentials.
  # Real values live in Vercel — Vercel handles the actual deployment.
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [quality, pdf_extract]

    env:
      # Public vars
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder_anon_key
      NEXT_PUBLIC_RAZORPAY_KEY_ID: rzp_test_placeholder
      NEXT_PUBLIC_APP_URL: https://interviewera.com
      NEXT_PUBLIC_CALENDLY_URL: https://calendly.com/placeholder
      # Server vars — SDKs that validate keys at import time need these to be non-empty
      SUPABASE_SERVICE_ROLE_KEY: placeholder_service_role
      OPENAI_API_KEY: sk-placeholder
      MISTRAL_API_KEY: placeholder_mistral
      OPENROUTER_API_KEY: placeholder_openrouter
      RESEND_API_KEY: re_placeholder
      RAZORPAY_KEY_ID: rzp_placeholder
      RAZORPAY_KEY_SECRET: placeholder_secret
      RAZORPAY_WEBHOOK_SECRET: placeholder_webhook
      UPSTASH_REDIS_REST_URL: https://placeholder.upstash.io
      UPSTASH_REDIS_REST_TOKEN: placeholder_token
      CRON_SECRET: placeholder_cron
      UNSUBSCRIBE_SECRET: placeholder_unsub

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Cache Next.js build
        uses: actions/cache@v5
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*.ts', 'src/**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-
            ${{ runner.os }}-nextjs-

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  # ── Job 3: Security Audit ────────────────────────────────────────────────────
  # Fails on critical vulnerabilities. High-severity issues in transitive
  # build-tool deps (serialize-javascript via next-pwa's Webpack chain) cannot
  # be fixed without a breaking next-pwa downgrade — tracked via Dependabot.
  audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit
        run: npm audit --audit-level=critical

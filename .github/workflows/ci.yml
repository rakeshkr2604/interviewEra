name: CI

# Triggers (updated to stop PR/push double-runs on feature branches):
# - pull_request → main: primary verification for branch work + Dependabot
# - push → main only: post-merge safety net (squash-merge commit ≠ PR HEAD)
# - workflow_dispatch: manual re-run
# Direct pushes to non-main branches without an open PR no longer run CI —
# open a PR (or dispatch) to verify. See docs/CI_CD_ARCHITECTURE.md.
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
  workflow_dispatch:

# Cancel superseded runs on the same PR or branch (new push cancels in-flight)
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ── Change detection (docs-only PRs skip heavy jobs; coverage jobs stay on) ──
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    # paths-filter uses the Pulls API on pull_request; repo default token is read-only.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.set.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # push events need parent commit for path filter; PRs use the merge API
          fetch-depth: 2

      # Explicit allowlist for heavy jobs. Prefer listing production paths over
      # `!**/*.md` denylists — those also exclude bundled `src/**/*.md` prompts.
      - name: Path filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - 'e2e/**'
              - 'public/**'
              - 'scripts/**'
              - 'supabase/**'
              - 'tests/**'
              - 'packages/**'
              - 'package.json'
              - 'package-lock.json'
              - 'next.config.*'
              - 'next-sitemap.config.js'
              - 'next-env.d.ts'
              - 'tsconfig*.json'
              - 'middleware.ts'
              - 'vercel.json'
              - 'components.json'
              - '.browserslistrc'
              - '.nvmrc'
              - 'eslint.config.*'
              - 'postcss.config.*'
              - 'playwright.config.*'
              - 'vitest.config.*'
              - '.github/workflows/*.yml'
              - '.github/workflows/*.yaml'
              - '.gitleaks.toml'
              - '.gitleaksignore'

      - name: Set code output
        id: set
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=${{ steps.filter.outputs.code }}" >> "$GITHUB_OUTPUT"
          fi

  # ── Job 1: Lint + Type Check ─────────────────────────────────────────────────
  quality:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # npm cache intentionally disabled: Free Actions storage is 0.5 GB; a single
      # setup-node npm cache entry is ~0.45–0.60 GB and multiplies per ref/key.
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Migration namespace
        run: npm run verify:migrations

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

  # ── Pdf extract regression (pdfjs-dist + fallback) ───────────────────────────
  pdf_extract:
    name: PDF extract regression
    runs-on: ubuntu-latest
    needs: [changes]

    steps:
      - name: Skip (docs-only)
        if: needs.changes.outputs.code != 'true'
        run: echo "No code changes — skipping PDF extraction."

      - name: Checkout
        if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@v7

      - name: Setup Node.js
        if: needs.changes.outputs.code == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        if: needs.changes.outputs.code == 'true'
        run: npm ci

      - name: Extract fixtures
        if: needs.changes.outputs.code == 'true'
        run: npm run verify:pdf

  # ── Job 2: Production Build (single build; shared with E2E via artifact) ─────
  # Uses e2e-compatible NEXT_PUBLIC_* values so the same .next artifact can be
  # served by Playwright (`npm start`). Remaining placeholders mirror the old
  # build job so SDKs that validate at import time still see non-empty strings.
  # Real values live in Vercel — Vercel handles the actual deployment.
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [changes, quality]

    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_RAZORPAY_KEY_ID: rzp_test_placeholder
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_CALENDLY_URL: https://calendly.com/placeholder
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      OPENAI_API_KEY: sk-placeholder
      MISTRAL_API_KEY: placeholder_mistral
      OPENROUTER_API_KEY: placeholder_openrouter
      RESEND_API_KEY: re_placeholder
      RAZORPAY_KEY_ID: rzp_test_placeholder
      RAZORPAY_KEY_SECRET: placeholder_secret
      RAZORPAY_WEBHOOK_SECRET: placeholder_webhook
      UPSTASH_REDIS_REST_URL: https://placeholder.upstash.io
      UPSTASH_REDIS_REST_TOKEN: placeholder_token
      CRON_SECRET: placeholder_cron
      UNSUBSCRIBE_SECRET: placeholder_unsub

    steps:
      - name: Skip (docs-only)
        if: needs.changes.outputs.code != 'true'
        run: echo "No code changes — skipping build."

      - name: Checkout
        if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@v7

      - name: Setup Node.js
        if: needs.changes.outputs.code == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Cache Next.js build
        if: needs.changes.outputs.code == 'true'
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json', 'next.config.ts') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-

      - name: Install dependencies
        if: needs.changes.outputs.code == 'true'
        run: npm ci

      - name: Build
        if: needs.changes.outputs.code == 'true'
        run: npm run build

      - name: Pack Next.js build
        if: needs.changes.outputs.code == 'true'
        run: tar -czf next-build.tar.gz --exclude='.next/cache' .next

      - name: Upload Next.js build artifact
        if: needs.changes.outputs.code == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: next-build-${{ github.sha }}
          if-no-files-found: error
          path: next-build.tar.gz
          retention-days: 1

  # ── Job 1b: E2E auth (Playwright) — reuses Build artifact ───────────────────
  e2e_auth:
    name: E2E Auth
    runs-on: ubuntu-latest
    needs: [changes, quality, build]
    env:
      # Must match Build job NEXT_PUBLIC_* (inlined at build time into the artifact).
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
      OPENAI_API_KEY: sk-placeholder
      RESEND_API_KEY: re_placeholder
      UPSTASH_REDIS_REST_URL: https://placeholder.upstash.io
      UPSTASH_REDIS_REST_TOKEN: placeholder_token
      RAZORPAY_KEY_ID: rzp_test_placeholder
      RAZORPAY_KEY_SECRET: placeholder_secret
      RAZORPAY_WEBHOOK_SECRET: placeholder_webhook
      NEXT_PUBLIC_RAZORPAY_KEY_ID: rzp_test_placeholder

    steps:
      - name: Skip (docs-only)
        if: needs.changes.outputs.code != 'true'
        run: echo "No code changes — skipping E2E."

      - name: Checkout
        if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@v7

      - name: Setup Node.js
        if: needs.changes.outputs.code == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        if: needs.changes.outputs.code == 'true'
        run: npm ci

      - name: Download Next.js build artifact
        if: needs.changes.outputs.code == 'true'
        uses: actions/download-artifact@v7
        with:
          name: next-build-${{ github.sha }}
          path: .

      - name: Unpack Next.js build
        if: needs.changes.outputs.code == 'true'
        run: |
          test -f next-build.tar.gz
          tar -xzf next-build.tar.gz
          test -f .next/BUILD_ID
          test -d .next/server
          test -d .next/static
          test -d public
          echo "BUILD_ID=$(cat .next/BUILD_ID)"

      - name: Install Playwright browsers
        if: needs.changes.outputs.code == 'true'
        run: npx playwright install chromium --with-deps

      - name: E2E tests
        if: needs.changes.outputs.code == 'true'
        run: npm run test:e2e
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000

  # ── Job 3: Security Audit ────────────────────────────────────────────────────
  # Fails on critical vulnerabilities. High-severity issues in transitive
  # build-tool deps (serialize-javascript via next-pwa's Webpack chain) cannot
  # be fixed without a breaking next-pwa downgrade — tracked via Dependabot.
  audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Audit
        run: npm audit --audit-level=critical

  # ── Job 4: Secret Scan ────────────────────────────────────────────────────────
  # Gitleaks — scans every push and PR for accidentally committed secrets.
  # Independent of the other jobs (like `audit`) so it doesn't slow down the
  # build; still contributes its own pass/fail status to the overall run.
  # Free for this repo (personal-account private repo — GITLEAKS_LICENSE is
  # only required for GitHub Organization-owned repos, not User-owned ones).
  # Config: .gitleaks.toml allowlists the two known-fake JWT-shaped placeholder
  # values already in this file's e2e_auth job (not real secrets).
  secrets_scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Job 5: Merge Readiness Summary ───────────────────────────────────────────
  # GitHub Free has no required-status-checks UI to show "all checks must pass"
  # in one place — this job builds that visibility by hand (Task 1A.1; see
  # MASTER_ENGINEERING_ROADMAP.md "Founder Decision — GitHub Free, Permanently").
  # Posts (or updates, on re-push) one PR comment summarizing every job's result.
  # `if: always()` so it still runs and reports even when an upstream job failed.
  merge_readiness:
    name: Merge Readiness Summary
    runs-on: ubuntu-latest
    if: always() && github.event_name == 'pull_request'
    needs: [changes, quality, e2e_auth, pdf_extract, build, audit, secrets_scan]
    permissions:
      pull-requests: write

    steps:
      - name: Post merge-readiness comment
        uses: actions/github-script@v7
        with:
          script: |
            const code = '${{ needs.changes.outputs.code }}';
            const changesResult = '${{ needs.changes.result }}';
            const results = {
              'Detect changes': changesResult,
              'Lint & Type Check': '${{ needs.quality.result }}',
              'E2E Auth': '${{ needs.e2e_auth.result }}',
              'PDF extract regression': '${{ needs.pdf_extract.result }}',
              'Build': '${{ needs.build.result }}',
              'Security Audit': '${{ needs.audit.result }}',
              'Secret Scan': '${{ needs.secrets_scan.result }}',
            };
            // When code changed, skipped heavy jobs are failures (e.g. changes job crashed).
            if (code === 'true') {
              for (const name of ['E2E Auth', 'PDF extract regression', 'Build']) {
                if (results[name] === 'skipped') results[name] = 'failure';
              }
            }
            const icon = (r) => (r === 'success' ? '✅' : r === 'skipped' ? '⏭️' : '❌');
            const allGood =
              changesResult === 'success' &&
              Object.entries(results)
                .filter(([name]) => name !== 'Detect changes')
                .every(([, r]) => r === 'success' || r === 'skipped');
            const lines = Object.entries(results).map(([name, r]) => `${icon(r)} **${name}** — ${r}`);
            if (code === 'true' || code === 'false') {
              lines.push('', `_Path filter \`code=${code}\` (${code === 'true' ? 'full' : 'docs-only / light'} pipeline)._`);
            }
            const marker = '<!-- ci-merge-readiness -->';
            const body = [
              marker,
              allGood
                ? '### ✅ Merge Readiness: all checks passed'
                : '### ❌ Merge Readiness: one or more checks failed',
              '',
              ...lines,
              '',
              '_GitHub Free has no required-status-checks gate — this comment is the visibility layer. Do not merge if anything above is red._',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

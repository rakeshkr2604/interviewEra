version: 2

updates:
  # ── npm dependencies ──────────────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      day: monday
      time: "12:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 2
    # Group related packages into a single PR to reduce noise
    groups:
      typescript-types:
        patterns:
          - "@types/*"
      eslint:
        patterns:
          - "eslint*"
          - "eslint-config-*"
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
          - "tw-animate-css"
      supabase:
        patterns:
          - "@supabase/*"
          - "supabase"
    # Skip patch bumps for stable dependencies to keep PR volume low
    ignore:
      # eslint-config-next / eslint-plugin-react are not ESLint-10-safe yet (Next.js #89764).
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "next"
        update-types: ["version-update:semver-patch"]
      - dependency-name: "react"
        update-types: ["version-update:semver-patch"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-patch"]

  # ── GitHub Actions ────────────────────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
